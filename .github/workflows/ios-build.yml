# iOS 模拟器构建流水线
#
# 为什么在 macos-14 上只构建 iphonesimulator：
#   模拟器构建不需要 Apple 开发者账号与证书，CODE_SIGNING_ALLOWED=NO 就能出 .app，
#   用来验证「工程能打开、Swift 源码能编译、资源能进 bundle」这三件最关键的事。
#   真机安装仍需在 Mac 上用 Xcode 手动签名（见 ios/PROJECT.md）。

name: iOS Build

on:
  push:
    paths:
      - "ios/**"
      - "ui/assets/qqbot/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "ios/**"
      - "ui/assets/qqbot/**"
      - ".github/workflows/ios-build.yml"
  # 允许手动触发一次完整构建
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (iOS Simulator)
    runs-on: macos-14
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 生成 1024x1024 AppIcon 需要 Pillow
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      # 把 ui/assets/qqbot 同步进 Resources/web，并拷贝 shared/AndroidShim.js
      - name: Sync H5 assets
        run: python ios/tools/sync_web.py

      - name: Generate app icon
        run: python ios/tools/gen_appicon.py

      # 纯 Python 生成 .xcodeproj（不依赖 xcodegen）
      - name: Generate Xcode project
        run: python ios/tools/gen_xcodeproj.py

      # 结构自校验：括号配平、UUID 定义、Sources phase 覆盖全部 .swift、INFOPLIST_FILE 路径
      - name: Validate Xcode project
        run: python ios/tools/gen_xcodeproj.py --check

      - name: Show Xcode version
        run: xcodebuild -version

      # generic/platform=iOS Simulator 让同一份命令覆盖 arm64 与 x86_64 两种模拟器架构
      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/AstrBotIOS.xcodeproj \
            -scheme AstrBotIOS \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      # 产物路径由 -derivedDataPath build 决定，if-no-files-found: error 防止假成功
      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: AstrBotIOS-simulator-app
          path: build/Build/Products/Debug-iphonesimulator/AstrBotIOS.app
          if-no-files-found: error
          retention-days: 7
