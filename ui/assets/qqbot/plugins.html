<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="color-scheme" content="dark light">
<title>插件</title>
<style>
/* ================= 令牌 ================= */
:root{
  --font: -apple-system, "MiSans", "HarmonyOS Sans SC", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
  --mono: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
  --r-xs:8px; --r-sm:12px; --r-md:16px; --r-lg:22px;
  --ease: cubic-bezier(.32,.72,0,1);
  --dur-fast:.18s; --dur:.28s; --dur-slow:.46s;
  --accent:#007aff; --ok:#34c759; --warn:#ff9f0a; --bad:#ff3b30;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
}
:root[data-theme="light"]{
  --label:#09090b; --label-2:rgba(60,60,67,.62); --label-3:rgba(60,60,67,.34);
  --sep:rgba(60,60,67,.15);
  --fill-1:rgba(120,120,128,.10); --fill-2:rgba(120,120,128,.16); --fill-3:rgba(120,120,128,.22);
  --page:#eef1f7;
  --card:rgba(255,255,255,.80);
  --field-bg:rgba(255,255,255,.75); --field-line:rgba(60,60,67,.14);
  --code-bg:rgba(120,120,128,.10);
  --shadow:0 10px 30px rgba(15,20,40,.08);
}
:root[data-theme="dark"]{
  --label:#ffffff; --label-2:rgba(235,235,245,.62); --label-3:rgba(235,235,245,.32);
  --sep:rgba(120,120,128,.34);
  --fill-1:rgba(120,120,128,.20); --fill-2:rgba(120,120,128,.28); --fill-3:rgba(120,120,128,.38);
  --page:#05060a;
  --card:rgba(28,29,34,.74);
  --field-bg:rgba(120,120,128,.16); --field-line:rgba(120,120,128,.28);
  --code-bg:rgba(0,0,0,.34);
  --shadow:0 10px 30px rgba(0,0,0,.44);
}

/* ================= 基础 ================= */
*{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
html,body{ margin:0; padding:0; height:100%; }
body{
  font-family:var(--font);
  background:var(--page);
  color:var(--label);
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y: contain;
  -webkit-text-size-adjust:100%;
}
button{
  font-family:inherit; font-size:16px; color:var(--label);
  border:0; background:var(--fill-1); border-radius:14px;
  min-height:44px; padding:0 16px; font-weight:560;
  touch-action:manipulation; cursor:pointer;
  transition:transform var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease), opacity var(--dur-fast);
}
button:active{ transform:scale(.965); background:var(--fill-3); }
button[disabled]{ opacity:.45; pointer-events:none; }
button.primary{ background:linear-gradient(180deg,#0a84ff,#0071e3); color:#fff; }
button.danger{ background:linear-gradient(180deg,#ff453a,#e0342b); color:#fff; }
button.ghost{ background:transparent; }
button.link{ background:transparent; color:var(--accent); padding:0 6px; min-height:36px; }
h1,h2,h3{ margin:0; font-weight:640; letter-spacing:-.2px; }
svg{ display:block; }
.ic{ width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }

/* ================= 顶栏 ================= */
.bar{
  position:sticky; top:0; z-index:20;
  display:flex; align-items:center; gap:8px;
  padding: calc(6px + var(--safe-t)) 8px 6px;
  background:color-mix(in srgb, var(--page) 82%, transparent);
  backdrop-filter:saturate(180%) blur(18px);
  -webkit-backdrop-filter:saturate(180%) blur(18px);
  border-bottom:1px solid var(--sep);
}
.bar .title{
  flex:1; min-width:0; text-align:center; font-size:17px; font-weight:640;
  letter-spacing:-.2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.iconbtn{
  width:44px; height:44px; min-height:44px; padding:0;
  display:flex; align-items:center; justify-content:center;
  background:transparent; border-radius:50%; flex:0 0 auto;
}
.iconbtn:active{ background:var(--fill-2); transform:none; }

/* ================= 布局 ================= */
main{ padding:14px 16px calc(28px + var(--safe-b)); }
.view[hidden]{ display:none; }
.card{
  background:var(--card);
  border:1px solid var(--sep);
  border-radius:var(--r-md);
  padding:16px; margin:0 0 14px;
  box-shadow:var(--shadow);
}
.hint{ color:var(--label-2); font-size:13.5px; line-height:1.55; margin:6px 0 0; }
.mono{ font-family:var(--mono); }
.sep{ height:1px; background:var(--sep); margin:12px 0; border:0; }
.row{ display:flex; align-items:center; gap:10px; }
.grow{ flex:1; min-width:0; }
.ellip{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.muted{ color:var(--label-2); }
.tiny{ font-size:12.5px; }

/* ================= 首页两个入口 ================= */
.entry{
  width:100%; display:flex; align-items:center; gap:14px;
  text-align:left; padding:18px 16px; margin:0 0 12px;
  min-height:84px; border-radius:var(--r-md);
  background:var(--card); border:1px solid var(--sep);
  box-shadow:var(--shadow);
  transition:transform var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
}
.entry:active{ transform:scale(.985); background:var(--fill-2); }
.entry .badge{
  width:46px; height:46px; flex:0 0 auto; border-radius:14px;
  display:flex; align-items:center; justify-content:center;
  background:linear-gradient(180deg, rgba(10,132,255,.22), rgba(10,132,255,.10));
  color:var(--accent);
}
.entry.market .badge{
  background:linear-gradient(180deg, rgba(52,199,89,.22), rgba(52,199,89,.10));
  color:var(--ok);
}
.entry .t{ font-size:17px; font-weight:620; letter-spacing:-.2px; }
.entry .s{ font-size:13px; color:var(--label-2); margin-top:2px; }
.entry .chev{ color:var(--label-3); flex:0 0 auto; }

/* ================= 列表 ================= */
.list{ margin:0; padding:0; list-style:none; background:var(--card); border:1px solid var(--sep); border-radius:var(--r-md); overflow:hidden; box-shadow:var(--shadow); }
.listitem{
  display:flex; align-items:center; gap:10px;
  width:100%; text-align:left; background:transparent; border:0; border-radius:0;
  padding:12px 14px; min-height:64px; color:var(--label); font-weight:400;
  transition:background var(--dur-fast) var(--ease);
}
.listitem:active{ background:var(--fill-2); transform:none; }
.listitem + .listitem{ border-top:1px solid var(--sep); }
.listitem .nm{ font-size:16px; font-weight:560; letter-spacing:-.1px; }
.listitem .sub{ font-size:12.5px; color:var(--label-2); margin-top:2px; }
.listitem .chev{ color:var(--label-3); flex:0 0 auto; }
.tag{
  display:inline-flex; align-items:center; height:22px; padding:0 8px;
  border-radius:999px; font-size:12px; font-weight:600;
  background:var(--fill-2); color:var(--label-2); flex:0 0 auto;
}
.tag.on{ background:rgba(52,199,89,.16); color:var(--ok); }
.tag.off{ background:rgba(255,159,10,.16); color:var(--warn); }

/* 开关：44x44 命中区，轨道 48x28 */
.sw{
  position:relative; width:52px; height:44px; flex:0 0 auto;
  background:transparent; padding:0; border-radius:22px; min-height:44px;
}
.sw .track{
  position:absolute; left:2px; top:8px; width:48px; height:28px;
  border-radius:14px; background:var(--fill-3);
  transition:background var(--dur) var(--ease);
}
.sw .knob{
  position:absolute; left:5px; top:11px; width:22px; height:22px;
  border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.3);
  transition:transform var(--dur) var(--ease);
}
.sw[aria-checked="true"] .track{ background:var(--ok); }
.sw[aria-checked="true"] .knob{ transform:translateX(20px); }
.sw:active{ transform:none; }

/* 搜索 */
.search{
  display:flex; align-items:center; gap:8px;
  background:var(--field-bg); border:1px solid var(--field-line);
  border-radius:var(--r-sm); padding:0 12px; margin:0 0 12px; min-height:44px;
}
.search input{
  flex:1; min-width:0; border:0; background:transparent; color:var(--label);
  font-family:inherit; font-size:16px; outline:none; padding:10px 0;
}
.search input::placeholder{ color:var(--label-3); }

/* ================= 详情 ================= */
.detail-head{ margin:0 0 14px; }
.detail-head h1{ font-size:22px; }
.detail-head .meta{ color:var(--label-2); font-size:13px; margin-top:4px; }
.actions{ display:flex; flex-wrap:wrap; gap:10px; margin:14px 0 0; }
.actions button{ flex:1 1 130px; }
.btns{ display:flex; gap:10px; flex-wrap:wrap; }

/* README / markdown */
.md{ font-size:15px; line-height:1.62; word-wrap:break-word; overflow-wrap:anywhere; }
.md > :first-child{ margin-top:0; }
.md > :last-child{ margin-bottom:0; }
.md h1,.md h2,.md h3,.md h4{ margin:18px 0 8px; line-height:1.3; letter-spacing:-.2px; }
.md h1{ font-size:21px; } .md h2{ font-size:18px; } .md h3{ font-size:16px; } .md h4{ font-size:15px; }
.md p{ margin:9px 0; }
.md ul,.md ol{ margin:9px 0; padding-left:22px; }
.md li{ margin:4px 0; }
.md blockquote{
  margin:10px 0; padding:8px 12px; border-left:3px solid var(--accent);
  background:var(--fill-1); border-radius:0 var(--r-xs) var(--r-xs) 0; color:var(--label-2);
}
.md pre{
  margin:10px 0; padding:12px; background:var(--code-bg);
  border-radius:var(--r-sm); overflow-x:auto; -webkit-overflow-scrolling:touch;
}
.md pre code{ font-family:var(--mono); font-size:13px; line-height:1.55; white-space:pre; }
.md code{
  font-family:var(--mono); font-size:13.5px; background:var(--code-bg);
  padding:1.5px 5px; border-radius:6px;
}
.md a{ color:var(--accent); text-decoration:none; border-bottom:1px solid rgba(10,132,255,.35); }
.md img{ max-width:100%; height:auto; border-radius:var(--r-sm); display:block; margin:10px 0; }
.md hr{ border:0; height:1px; background:var(--sep); margin:16px 0; }
.md table{ width:100%; border-collapse:collapse; font-size:13.5px; margin:10px 0; display:block; overflow-x:auto; }
.md th,.md td{ border:1px solid var(--sep); padding:6px 8px; text-align:left; }
.md .md-raw{ font-family:var(--mono); font-size:13px; white-space:pre; overflow-x:auto; }

/* 配置编辑器 */
.cfg-toolbar{ display:flex; gap:8px; margin:0 0 10px; flex-wrap:wrap; }
.cfg-toolbar button{ flex:1 1 90px; font-size:14px; min-height:40px; }
textarea#cfgText{
  width:100%; min-height:260px; resize:vertical;
  font-family:var(--mono); font-size:16px; line-height:1.6; letter-spacing:-.2px;
  color:var(--label); background:var(--field-bg);
  border:1px solid var(--field-line); border-radius:var(--r-sm);
  padding:12px; outline:none; tab-size:2;
}
textarea#cfgText:focus{ border-color:var(--accent); }
.errline{ color:var(--bad); font-size:13px; margin:8px 0 0; }

/* 进度 / 提示 */
.progress{ height:4px; border-radius:2px; background:var(--fill-2); overflow:hidden; margin:12px 0 0; }
.progress > i{ display:block; height:100%; width:30%; background:var(--accent); border-radius:2px; animation:slide 1.1s var(--ease) infinite; }
@keyframes slide{ 0%{ transform:translateX(-100%);} 100%{ transform:translateX(360%);} }
#toast{
  position:fixed; left:50%; bottom:calc(24px + var(--safe-b)); transform:translate(-50%, 20px);
  max-width:min(88vw, 420px); padding:12px 16px; border-radius:14px;
  background:rgba(28,29,34,.94); color:#fff; font-size:14.5px; line-height:1.45;
  box-shadow:0 12px 34px rgba(0,0,0,.34); opacity:0; pointer-events:none;
  transition:opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
  z-index:60; word-break:break-word;
}
#toast.show{ opacity:1; transform:translate(-50%,0); }
.empty{ text-align:center; padding:38px 20px; color:var(--label-2); font-size:14.5px; }
.demo-note{
  margin:0 0 14px; padding:10px 12px; border-radius:var(--r-sm);
  background:rgba(255,159,10,.14); color:var(--warn); font-size:13px; line-height:1.5;
}
.spin{ animation:spin 1s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }
@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
}
</style>
</head>
<body>

<header class="bar">
  <button class="iconbtn" id="btnBack" aria-label="返回">
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <div class="title" id="barTitle">插件</div>
  <button class="iconbtn" id="btnTheme" aria-label="切换主题">
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" id="themeIcon"><path d="M12 3.2v1.6M12 19.2v1.6M3.2 12h1.6M19.2 12h1.6M5.8 5.8l1.1 1.1M17.1 17.1l1.1 1.1M5.8 18.2l1.1-1.1M17.1 6.9l1.1-1.1"/><circle cx="12" cy="12" r="4.2"/></svg>
  </button>
</header>

<main>
  <!-- 首页：只有两个入口 -->
  <section class="view" id="viewHome">
    <button class="entry local" id="goLocal">
      <span class="badge">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5A2.5 2.5 0 016.5 5h3.2l1.6 2H17.5A2.5 2.5 0 0120 9.5v7A2.5 2.5 0 0117.5 19h-11A2.5 2.5 0 014 16.5z"/></svg>
      </span>
      <span class="grow">
        <span class="t">本机插件</span>
        <span class="s">开关、配置、重载、更新</span>
      </span>
      <svg class="ic chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </button>

    <button class="entry market" id="goMarket">
      <span class="badge">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5l1.4-4h13.2l1.4 4"/><path d="M5 9.5h14v9a1.5 1.5 0 01-1.5 1.5h-11A1.5 1.5 0 015 18.5z"/><path d="M9.5 12.5h5"/></svg>
      </span>
      <span class="grow">
        <span class="t">插件市场</span>
        <span class="s">搜索、看说明、安装</span>
      </span>
      <svg class="ic chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </button>
    <div class="demo-note" id="demoNote" hidden></div>
  </section>

  <!-- 本机插件列表 -->
  <section class="view" id="viewLocal" hidden>
    <ul class="list" id="localList"></ul>
    <div class="empty" id="localEmpty" hidden>还没有装任何插件。<br>去「插件市场」挑一个吧。</div>
  </section>

  <!-- 本机插件详情 -->
  <section class="view" id="viewLocalDetail" hidden>
    <div class="detail-head">
      <h1 id="ldName">—</h1>
      <div class="meta" id="ldMeta"></div>
    </div>
    <div class="actions" id="ldActions"></div>
    <div id="ldStatus"></div>
    <div class="card" id="ldReadmeCard">
      <div class="row"><h2 class="grow" style="font-size:16px">说明</h2></div>
      <div class="md" id="ldReadme"></div>
    </div>
    <div class="card">
      <div class="row" style="margin-bottom:12px">
        <h2 class="grow" style="font-size:16px">配置</h2>
        <span class="tag" id="cfgTag">—</span>
      </div>
      <div class="cfg-toolbar">
        <button id="cfgReload">重新读取</button>
        <button id="cfgFormat">格式化</button>
        <button class="primary" id="cfgSave">保存</button>
      </div>
      <textarea id="cfgText" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="{}"></textarea>
      <div class="errline" id="cfgErr" hidden></div>
      <div class="hint" id="cfgPath"></div>
    </div>
  </section>

  <!-- 插件市场 -->
  <section class="view" id="viewMarket" hidden>
    <div class="search">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color:var(--label-3)"><circle cx="11" cy="11" r="6.2"/><path d="M16 16l4 4"/></svg>
      <input id="marketSearch" type="search" placeholder="搜索插件名、作者或关键词" enterkeyhint="search">
      <button class="iconbtn" id="marketRefresh" aria-label="刷新市场">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:19px;height:19px"><path d="M20 12a8 8 0 10-2.6 5.9"/><path d="M20 5.5V11h-5.5"/></svg>
      </button>
    </div>
    <ul class="list" id="marketList"></ul>
    <div class="empty" id="marketEmpty" hidden>没有匹配的插件</div>
  </section>

  <!-- 市场详情 -->
  <section class="view" id="viewMarketDetail" hidden>
    <div class="detail-head">
      <h1 id="mdName">—</h1>
      <div class="meta" id="mdMeta"></div>
    </div>
    <div class="actions" id="mdActions"></div>
    <div id="mdStatus"></div>
    <div class="card">
      <div class="md" id="mdReadme">正在读说明…</div>
    </div>
  </section>
</main>

<div id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  /* ============================ 小工具 ============================ */
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = String(text);
    return n;
  }
  var CHEV = '<svg class="ic chev" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px"><path d="M9 6l6 6-6 6"/></svg>';

  var toastTimer = 0;
  function toast(msg, ms) {
    var t = $("toast");
    if (!t) return;
    t.textContent = String(msg == null ? "" : msg);
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, ms || 2600);
  }

  /* ============================ 主题 ============================ */
  var THEME_KEY = "qqbot.plugins.theme";
  function paintThemeIcon() {
    var icon = $("themeIcon");
    if (!icon) return;
    var dark = document.documentElement.getAttribute("data-theme") === "dark";
    icon.innerHTML = dark
      ? '<path d="M20.5 14.4A8.6 8.6 0 019.6 3.5 8.6 8.6 0 1020.5 14.4z"/>'
      : '<path d="M12 3.2v1.6M12 19.2v1.6M3.2 12h1.6M19.2 12h1.6M5.8 5.8l1.1 1.1M17.1 17.1l1.1 1.1M5.8 18.2l1.1-1.1M17.1 6.9l1.1-1.1"/><circle cx="12" cy="12" r="4.2"/>';
  }
  function setTheme(t) {
    var v = (t === "light") ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", v);
    try { localStorage.setItem(THEME_KEY, v); } catch (e) { }
    paintThemeIcon();
  }
  function initTheme() {
    var t = "";
    try { t = localStorage.getItem(THEME_KEY) || ""; } catch (e) { }
    if (t !== "light" && t !== "dark") {
      var q = window.matchMedia ? window.matchMedia("(prefers-color-scheme: light)") : null;
      t = (q && q.matches) ? "light" : "dark";
    }
    setTheme(t);
  }

  /* ============================ 桥 ============================ */
  var BR = (typeof AndroidPlugins !== "undefined" && AndroidPlugins) ? AndroidPlugins : null;
  var DEMO = !BR;

  function pj(s) {
    if (s == null) return null;
    if (typeof s === "object") return s;
    try { return JSON.parse(String(s)); } catch (e) { return null; }
  }
  function call(name) {
    if (!BR) return null;
    var args = Array.prototype.slice.call(arguments, 1);
    try {
      var fn = BR[name];
      if (typeof fn !== "function") return null;
      return pj(fn.apply(BR, args));
    } catch (e) {
      return { ok: false, err: "调用桥失败：" + (e && e.message ? e.message : e) };
    }
  }

  /* ============================ 演示数据（用浏览器直接打开时） ============================ */
  var DEMO_LOCAL = [
    { name: "astrbot_plugin_weather", version: "1.4.2", desc: "查天气：发「天气 北京」就回一段预报", author: "Soulter", enabled: true, dir: "astrbot_plugin_weather", hasConfig: true, hasWebui: true, repo: "Soulter/astrbot_plugin_weather" },
    { name: "astrbot_plugin_memo", version: "0.9.0", desc: "记备忘、到点提醒", author: "community", enabled: false, dir: "astrbot_plugin_memo", hasConfig: true, hasWebui: false, repo: "community/astrbot_plugin_memo" },
    { name: "astrbot_plugin_bilibili", version: "2.1.0", desc: "B 站推送：新视频、直播开播", author: "kawayi", enabled: true, dir: "astrbot_plugin_bilibili", hasConfig: false, hasWebui: false, repo: "" }

  /* ============================ markdown → HTML ============================ */
  /*
   * README 是别人仓库里的文本：一律先 esc() 再拼标签，正文永远不会被当成 HTML 解析。
   * 支持：标题 / 段落 / 列表 / 引用 / 围栏代码块 / 行内代码 / 表格 / 链接 / 图片 / 粗体 / 斜体 / 删除线。
   */
  function safeUrl(u) {
    var s = String(u == null ? "" : u).trim();
    if (!s) return "";
    if (/^https?:\/\//i.test(s)) return s;
    if (/^\.{0,2}\//.test(s)) return s;
    return "";
  }

  function mdInline(raw) {
    var codes = [];
    var s = esc(raw);
    s = s.replace(/`([^`]+)`/g, function (_, c) {
      codes.push(c);
      return "\u0001" + (codes.length - 1) + "\u0002";
    });
    s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g, function (m, alt, url) {
      var u = safeUrl(url);
      return u ? '<img src="' + u + '" alt="' + alt + '" loading="lazy">' : alt;
    });
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g, function (m, txt, url) {
      var u = safeUrl(url);
      return u ? '<a href="' + u + '" target="_blank" rel="noopener noreferrer">' + txt + "</a>" : txt;
    });
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/__([^_]+)__/g, "<strong>$1</strong>");
    s = s.replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<em>$2</em>");
    s = s.replace(/~~([^~]+)~~/g, "<del>$1</del>");
    s = s.replace(/\u0001(\d+)\u0002/g, function (_, i) { return "<code>" + codes[+i] + "</code>"; });
    return s;
  }

  function md(src) {
    var lines = String(src == null ? "" : src).replace(/\r\n?/g, "\n").split("\n");
    var out = [];
    var i = 0;
    while (i < lines.length) {
      var line = lines[i];
      if (/^\s*$/.test(line)) { i++; continue; }

      var fence = line.match(/^\s*(`{3,}|~{3,})\s*([A-Za-z0-9_+#.-]*)\s*$/);
      if (fence) {
        var mark = fence[1].charAt(0);
        var need = fence[1].length;
        var buf = [];
        var j = i + 1;
        var closeRe = new RegExp("^\\s*" + (mark === "`" ? "`" : "~") + "{" + need + ",}\\s*$");
        while (j < lines.length && !closeRe.test(lines[j])) { buf.push(lines[j]); j++; }
        out.push("<pre><code>" + esc(buf.join("\n")) + "</code></pre>");
        i = j + 1;
        continue;
      }

      var h = line.match(/^(#{1,6})\s+(.+?)\s*#*\s*$/);
      if (h) {
        var lv = h[1].length;
        out.push("<h" + lv + ">" + mdInline(h[2]) + "</h" + lv + ">");
        i++;
        continue;
      }

      if (/^\s*(?:-\s*-\s*-|_\s*_\s*_|\*\s*\*\s*\*)\s*$/.test(line)) { out.push("<hr>"); i++; continue; }

      if (/^\s*>/.test(line)) {
        var qbuf = [];
        while (i < lines.length && /^\s*>/.test(lines[i])) {
          qbuf.push(mdInline(lines[i].replace(/^\s*>\s?/, "")));
          i++;
        }
        out.push("<blockquote>" + qbuf.join("<br>") + "</blockquote>");
        continue;
      }

      if (/^\s*\|/.test(line) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
        var cells = function (ln) {
          return ln.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|");
        };
        var head = cells(line);
        i += 2;
        var rows = [];
        while (i < lines.length && /^\s*\|/.test(lines[i])) { rows.push(cells(lines[i])); i++; }
        var html = "<table><thead><tr>";
        for (var c = 0; c < head.length; c++) html += "<th>" + mdInline(head[c].trim()) + "</th>";
        html += "</tr></thead><tbody>";
        for (var r = 0; r < rows.length; r++) {
          html += "<tr>";
          for (var c2 = 0; c2 < head.length; c2++) {
            html += "<td>" + mdInline((rows[r][c2] == null ? "" : rows[r][c2]).trim()) + "</td>";
          }
          html += "</tr>";
        }
        out.push(html + "</tbody></table>");
        continue;
      }

      var li = line.match(/^\s*([-*+]|\d+[.)])\s+/);
      if (li) {
        var ordered = /\d/.test(li[1]);
        var items = [];
        while (i < lines.length) {
          var m2 = lines[i].match(/^\s*([-*+]|\d+[.)])\s+(.*)$/);
          if (m2) { items.push(mdInline(m2[2])); i++; }
          else if (/^\s{2,}\S/.test(lines[i]) && items.length) {
            items[items.length - 1] += " " + mdInline(lines[i].trim());
            i++;
          } else break;
        }
        var tag = ordered ? "ol" : "ul";
        var lh = "<" + tag + ">";
        for (var k = 0; k < items.length; k++) lh += "<li>" + items[k] + "</li>";
        out.push(lh + "</" + tag + ">");
        continue;
      }

      var para = [];
      while (i < lines.length && !/^\s*$/.test(lines[i]) &&
        !/^\s*(#{1,6}\s|>|`{3,}|~{3,})/.test(lines[i]) &&
        !/^\s*([-*+]|\d+[.)])\s+/.test(lines[i]) &&
        !/^\s*\|/.test(lines[i])) {
        para.push(mdInline(lines[i].trim()));
        i++;
      }
      if (para.length) out.push("<p>" + para.join("<br>") + "</p>");
      else i++;
    }
    return out.join("\n");
  }

  /* ============================ 任务轮询（所有写操作共用） ============================ */
  function setBusy(label) {
    S.busy = !!label;
    S.taskLabel = label || "";
    var box = (S.view === "marketDetail") ? $("mdStatus") : $("ldStatus");
    if (box) {
      if (S.busy) {
        box.innerHTML = '<div class="progress"><i></i></div><div class="hint">' + esc(label) + "…</div>";
      } else {
        box.innerHTML = "";
      }
    }
    var btns = document.querySelectorAll("#ldActions button, #mdActions button");
    for (var i = 0; i < btns.length; i++) btns[i].disabled = S.busy;
  }

  function beginPolling(label, done) {
    clearInterval(S.taskPoll);
    S.taskSince = Date.now();
    setBusy(label);
    var idle = 0;
    S.taskPoll = setInterval(function () {
      if (Date.now() - S.taskSince > 120000) {
        clearInterval(S.taskPoll);
        setBusy("");
        toast("等太久了，回列表看看结果吧");
        return;
      }
      var r = call("taskPoll");
      if (!r) { clearInterval(S.taskPoll); setBusy(""); return; }
      var st = String(r.state || "");
      if (st === "running") { idle = 0; return; }
      if (st === "ok" || st === "fail") {
        clearInterval(S.taskPoll);
        setBusy("");
        toast(r.msg || (st === "ok" ? "完成了" : "失败了"));
        if (done) done(r);
        return;
      }
      /* idle：任务还没登记上，给它 2 秒；一直 idle 说明这个动作根本没跑 */
      idle++;
      if (idle > 5) { clearInterval(S.taskPoll); setBusy(""); }
    }, 400);
  }

  /* V8 新版只说 "Unexpected token '}', ... is not valid JSON"，不给 position，
     所以自己扫一遍 JSON 找到第一个出错字符，再换算成行号。 */
  function jsonErrPos(text) {
    var i = 0, n = text.length, bad = -1;
    function fail() { if (bad < 0) bad = i; throw new Error("bad"); }
    function ws() {
      while (i < n) {
        var c = text.charAt(i);
        if (c === " " || c === "\n" || c === "\r" || c === "\t") { i++; } else { break; }
      }
    }
    function str() {
      if (text.charAt(i) !== '"') fail();
      i++;
      while (i < n) {
        var c = text.charAt(i);
        if (c === '"') { i++; return; }
        if (c === "\\") { i += 2; continue; }
        if (c === "\n" || c === "\r") fail();
        i++;
      }
      fail();
    }
    function num() {
      var start = i;
      if (text.charAt(i) === "-") i++;
      while (i < n && text.charAt(i) >= "0" && text.charAt(i) <= "9") i++;
      if (i < n && text.charAt(i) === ".") {
        i++;
        while (i < n && text.charAt(i) >= "0" && text.charAt(i) <= "9") i++;
      }
      if (i < n && (text.charAt(i) === "e" || text.charAt(i) === "E")) {
        i++;
        if (text.charAt(i) === "+" || text.charAt(i) === "-") i++;
        while (i < n && text.charAt(i) >= "0" && text.charAt(i) <= "9") i++;
      }
      if (i === start || (i === start + 1 && text.charAt(start) === "-")) fail();
    }
    function val(depth) {
      if (depth > 64) fail();
      ws();
      if (i >= n) fail();
      var c = text.charAt(i);
      if (c === "{") {
        i++; ws();
        if (text.charAt(i) === "}") { i++; return; }
        for (;;) {
          ws();
          if (text.charAt(i) !== '"') fail();
          str(); ws();
          if (text.charAt(i) !== ":") fail();
          i++;
          val(depth + 1); ws();
          c = text.charAt(i);
          if (c === ",") { i++; continue; }
          if (c === "}") { i++; return; }
          fail();
        }
      } else if (c === "[") {
        i++; ws();
        if (text.charAt(i) === "]") { i++; return; }
        for (;;) {
          val(depth + 1); ws();
          c = text.charAt(i);
          if (c === ",") { i++; continue; }
          if (c === "]") { i++; return; }
          fail();
        }
      } else if (c === '"') { str(); }
      else if (c === "t") { if (text.substr(i, 4) !== "true") fail(); i += 4; }
      else if (c === "f") { if (text.substr(i, 5) !== "false") fail(); i += 5; }
      else if (c === "n") { if (text.substr(i, 4) !== "null") fail(); i += 4; }
      else if (c === "-" || (c >= "0" && c <= "9")) { num(); }
      else fail();
    }
    try { val(0); ws(); if (i < n) fail(); } catch (e) { return bad; }
    return -1;
  }

  function lineOfPos(text, pos) {
    var line = 1;
    for (var i = 0; i < pos && i < text.length; i++) if (text.charAt(i) === "\n") line++;
    return line;
  }

  function jsonErrHint(text) {
    var msg = "";
    try { JSON.parse(text); return ""; } catch (e) { msg = (e && e.message) ? e.message : String(e); }
    var line = 0;
    var pos = jsonErrPos(text);
    if (pos >= 0) line = lineOfPos(text, pos);
    if (!line) {
      var m = /line (\d+)/i.exec(msg);
      if (m) line = parseInt(m[1], 10);
    }
    if (!line) {
      var p = /position (\d+)/i.exec(msg);
      if (p) line = lineOfPos(text, parseInt(p[1], 10));
    }
    return (line ? "第 " + line + " 行附近：" : "") + msg;
  }

  function actSaveConfig(p) {

      return;
    }
    err.hidden = true;

    call("writeConfig", p.name, text);

    });
  }

  /* ============================ 本机详情里的动作 ============================ */
  function actReload(p) {
    if (S.busy) return;
    if (DEMO) { toast("预览模式：真机上才会重载"); return; }
    call("reloadPlugin", p.name);
    beginPolling("重载 " + p.name, function () { loadLocal(); });
  }

  function actUpdate(p) {
    if (S.busy) return;
    if (DEMO) { toast("预览模式：真机上才会更新"); return; }
    call("update", p.name);
    beginPolling("更新 " + p.name, function () { loadLocal(); });
  }

  function actWebui(p) {
    if (DEMO) { toast("预览模式：WebUI 地址要真机才算得出来"); return; }
    var r = call("webui", p.name);
    if (!r || !r.ok) { toast((r && r.err) || "这个插件没有 WebUI"); return; }
    if (!r.up) toast("控制台没在运行，先把它跑起来");
    call("openExternal", r.url);
    toast(r.hint || "已交给浏览器打开", 3600);
  }

  function actUninstall(p) {
    if (S.busy) return;
    confirmBar("卸载「" + p.name + "」？插件目录会删掉，配置会留着。", function () {
      if (DEMO) { toast("预览模式：真机上才会卸载"); return; }
      call("uninstall", p.name);
      beginPolling("卸载 " + p.name, function (r) {
        loadLocal();
        if (r && r.state === "ok") goBack();
      });
    });
  }

  function confirmBar(text, onYes) {
    var act = $("ldActions");
    act.innerHTML = "";
    var tip = el("div", "hint", text);
    tip.style.width = "100%";
    act.appendChild(tip);
    var no = el("button", "", "取消");
    no.addEventListener("click", function () { renderLocalDetail(); });
    var yes = el("button", "danger", "确定卸载");
    yes.addEventListener("click", onYes);
    act.appendChild(no);
    act.appendChild(yes);
  }

  /* ============================ 插件市场 ============================ */
  function loadMarket(force) {
    if (DEMO) { S.market = DEMO_MARKET.slice(); S.marketState = "ok"; if (S.view === "market") renderMarket(); return; }
    S.marketState = "loading";
    if (S.view === "market") renderMarket();
    call("market", !!force);
    beginMarketPoll();
  }

  function beginMarketPoll() {
    clearInterval(S.marketPoll);
    var t0 = Date.now();
    S.marketPoll = setInterval(function () {
      var r = call("marketPoll");
      if (!r) { clearInterval(S.marketPoll); S.marketState = "fail"; S.marketErr = "没连上桥"; if (S.view === "market") renderMarket(); return; }
      var st = String(r.state || "");
      if (st === "ok") {
        clearInterval(S.marketPoll);
        S.market = r.plugins || [];
        S.marketState = "ok";
        S.marketErr = "";
        if (S.view === "market") renderMarket();
        return;
      }
      if (st === "fail") {
        clearInterval(S.marketPoll);
        S.market = r.plugins || [];
        S.marketState = "fail";
        S.marketErr = r.error || "市场列表拉不下来";
        if (S.view === "market") renderMarket();
        return;
      }
      if (Date.now() - t0 > 45000) {
        clearInterval(S.marketPoll);
        S.marketState = "fail";
        S.marketErr = "等太久了：网络可能不通，先在有网的地方刷新一次";
        if (S.view === "market") renderMarket();
      }
    }, 400);
  }

  function marketRow(item) {
    var li = el("li", "listitem");
    li.setAttribute("data-id", item.id || item.name || "");
    var box = el("div", "grow");
    box.appendChild(el("div", "nm ellip", item.name || "(没名字)"));
    var sub = [];
    if (item.version) sub.push("v" + item.version);
    if (item.author) sub.push(item.author);
    if (item.stars) sub.push("★" + item.stars);
    if (item.desc) sub.push(item.desc);
    box.appendChild(el("div", "sub ellip", sub.join(" · ")));
    li.appendChild(box);
    if (item.installed) {
      var tag = el("span", "tag on", "已装");
      li.appendChild(tag);
    }
    var ch = el("span", "chev");
    ch.innerHTML = CHEV;
    li.appendChild(ch);
    return li;
  }

  function renderMarket() {
    var ul = $("marketList");
    ul.innerHTML = "";
    var empty = $("marketEmpty");
    if (S.marketState === "loading") {
      empty.hidden = false;
      empty.textContent = "正在拉市场列表…";
      return;
    }
    if (S.marketState === "fail" && !S.market.length) {
      empty.hidden = false;
      empty.textContent = S.marketErr || "市场列表拉不下来";
      return;
    }
    var q = S.query.trim().toLowerCase();
    var shown = 0;
    for (var i = 0; i < S.market.length; i++) {
      var it = S.market[i];
      if (q) {
        var hay = ((it.name || "") + " " + (it.desc || "") + " " + (it.author || "")).toLowerCase();
        if (hay.indexOf(q) < 0) continue;
      }
      ul.appendChild(marketRow(it));
      shown++;
    }
    empty.hidden = shown > 0;
    if (!shown) empty.textContent = q ? ("没有匹配「" + S.query + "」的插件") : "市场里现在没有插件";
    if (S.marketState === "fail" && S.marketErr) toast(S.marketErr);
  }

  function findMarket(idOrName) {
    for (var i = 0; i < S.market.length; i++) {
      var it = S.market[i];
      if (it.id === idOrName || it.name === idOrName) return it;
    }
    return null;
  }

  function openMarket(id) {
    var it = findMarket(id);
    if (!it) { toast("这条不见了，刷新一下市场"); return; }
    S.cur = it;
    S.curKind = "market";
    push("marketDetail", it);
  }

  function renderMarketDetail() {
    var it = S.cur;
    if (!it) return;
    $("mdName").textContent = it.name || "—";
    var bits = [];
    if (it.author) bits.push(it.author);
    if (it.version) bits.push("v" + it.version);
    if (it.stars) bits.push("★ " + it.stars);
    if (it.installed) bits.push("已安装");
    $("mdMeta").textContent = bits.join(" · ");

    var act = $("mdActions");
    act.innerHTML = "";
    var local = null;
    for (var i = 0; i < S.local.length; i++) {
      if (S.local[i].name === it.name) { local = S.local[i]; break; }
    }
    var b = el("button", "primary", it.installed || local ? "重新安装 / 更新" : "安装");
    b.addEventListener("click", function () { actInstall(it, b); });
    act.appendChild(b);
    if (it.repo) {
      var rb = el("button", "", "打开仓库");
      rb.addEventListener("click", function () {
        if (DEMO) { toast("预览模式"); return; }
        call("openExternal", "https://github.com/" + it.repo);
      });
      act.appendChild(rb);
    }

    var target = $("mdReadme");
    if (DEMO) { target.innerHTML = md(DEMO_MD); return; }
    loadReadme(it.name, it.repo || "", target);
  }

  function actInstall(it, btn) {
    if (S.busy) return;
    if (DEMO) { toast("预览模式：装到手机上才能真安装"); return; }
    call("install", it.id || it.name);
    beginPolling("安装 " + it.name, function (r) {
      loadLocal();
      loadMarket(true);
      if (r.state === "fail") toast(r.msg || "安装失败", 3600);
    });
  }

  /* ============================ 事件绑定 ============================ */
  function bind() {
    $("btnBack").addEventListener("click", goBack);
    $("btnTheme").addEventListener("click", function () {
      setTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
    });

    $("goLocal").addEventListener("click", function () {
      push("local");
      loadLocal();
    });
    $("goMarket").addEventListener("click", function () {
      push("market");
      loadMarket(false);
    });

    $("localList").addEventListener("click", function (ev) {
      var row = ev.target.closest ? ev.target.closest(".listitem") : null;
      if (!row) return;
      var name = row.getAttribute("data-name") || "";
      var sw = ev.target.closest ? ev.target.closest(".sw") : null;
      var p = findLocal(name);
      if (!p) return;
      if (sw) { doToggle(p, sw); return; }
      openLocal(name);
    });

    $("marketList").addEventListener("click", function (ev) {
      var row = ev.target.closest ? ev.target.closest(".listitem") : null;
      if (!row) return;
      openMarket(row.getAttribute("data-id") || "");
    });

    $("marketSearch").addEventListener("input", function (ev) {
      S.query = ev.target.value || "";
      if (S.view === "market") renderMarket();
    });
    $("marketRefresh").addEventListener("click", function () {
      if (S.marketState === "loading") return;
      loadMarket(true);
      toast("正在刷新市场…", 1500);
    });

    $("cfgSave").addEventListener("click", function () {
      if (!S.cur) return;
      actSaveConfig(S.cur);
    });
    $("cfgFormat").addEventListener("click", function () {
      var cfg = $("cfgText");
      var bad = jsonErrHint(cfg.value);
      if (bad) { $("cfgErr").hidden = false; $("cfgErr").textContent = "JSON 有语法错误 —— " + bad; return; }
      try { cfg.value = JSON.stringify(JSON.parse(cfg.value), null, 2); $("cfgErr").hidden = true; } catch (e) { }
    });
    $("cfgReload").addEventListener("click", function () {
      if (!S.cur) return;
      loadConfig(S.cur.name);
      toast("已重新读取", 1500);
    });

    window.addEventListener("popstate", function () {
      if (S.stack.length > 1) backOne();
    });
    window.addEventListener("error", function (e) {
      /* 出错也别白屏：给个能看懂的提示 */
      if (e && e.message) console.error("[plugins]", e.message);
    });
  }

  /* ============================ 启动 ============================ */
  function boot() {
    initTheme();
    bind();
    if (DEMO) {
      var n = $("demoNote");
      n.hidden = false;
      n.textContent = "预览模式：现在看到的是演示数据。装到手机上（从「更多工具 → 插件」进来）才会读到真插件。";
      loadLocal();
      loadMarket(false);
    }
    render();
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
</body>
</html>
